<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Test</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #222;
    }

    p {
      color: #666;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Hello World 👋</h1>
    <p>This is a simple HTML testing page.</p>

    <button onclick="showMessage()">
      Click Me
    </button>

    <p id="message"></p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Button is working successfully!";
    }
  </script>

</body>
</html>
